version: "3.9"

# Denetim Faz 4 — Yerel LLM (Ollama) opsiyonel eklentisi.
# Ana docker-compose.yml'yi DEĞİŞTİRMEZ, ayrı bir dosyadır — istenirse
# uygulama üstüne eklenir:
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# Sonra backend'in "toprax-net" ağı üzerinden Ollama'ya erişebilmesi için
# Ayarlar > Entegrasyonlar > AI Servisi > Yerel LLM bölümüne
#   Ollama URL: http://ollama:11434
# girilir (backend konteyner İÇİNDEN çalıştığı için "localhost" DEĞİL,
# compose servis adı "ollama" kullanılır). Backend konteyner dışında
# (yerel geliştirmede, uvicorn doğrudan Windows'ta çalışırken) ise
# http://localhost:11434 kullanılır.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: toprax-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      # Sadece localhost'a açık — dışarıya kapalı (Mongo'nun P0 düzeltmesiyle
      # AYNI ihtiyat: yerel LLM sunucusu da host'un dışına açılmamalı).
      # NOT (2026-07-25, canlıda bulundu): host portu 11435 — standart 11434
      # bu geliştirme makinesinde TOPRAX'a AİT OLMAYAN başka bir Ollama
      # container'ı (ciftci_ollama) tarafından zaten kullanılıyor, "ports are
      # not available" ile çakışıyordu. Konteyner İÇİ port değişmedi (backend
      # ağ üzerinden hep "ollama:11434" kullanır); bu sadece host'tan erişim
      # için farklı bir dış port.
      - "127.0.0.1:11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - toprax-net
    # GPU (2026-08-19'da AÇILDI): bu makinede NVIDIA RTX 5070 Laptop / 8 GB
    # VRAM var ve Docker Desktop NVIDIA çalışma zamanını sunuyor. `qwen3:8b`
    # 4-bit nicemlemeyle ~5 GB yer kaplar, yani GPU'ya sığar; CPU'da aynı
    # model dakikalar sürerken GPU'da ~15 sn'de yanıt veriyor (Çiftçi AI'da
    # ölçüldü, bkz. Modelfile.toprax başlığı).
    #
    # GPU'suz bir makinede bu blok "could not select device driver" hatası
    # verir — o durumda aşağıdaki 6 satır yorum satırına alınır, uygulama
    # CPU'da çalışmaya devam eder (sadece yavaş).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_models:

# NOT: "toprax-net" ağı burada YENİDEN TANIMLANMAZ — docker-compose.yml
# (-f ile ilk verilen dosya) zaten tanımlıyor; iki dosya BİRLEŞTİRİLEREK
# çalıştırıldığında (yukarıdaki komut) aynı ağ anahtarı otomatik çözülür.
# Bu dosya TEK BAŞINA ("docker compose -f docker-compose.ollama.yml up")
# çalıştırılamaz — ana dosyayla birlikte kullanılmalıdır.
